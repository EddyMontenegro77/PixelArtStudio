<div class="settingsbar-container">
  <div class="navigation-buttons">
    <a class="bg-btn compact-btn" routerLink="/">Return</a>
    <button class="bg-btn compact-btn" type="button" (click)="toggleTheme()">
      Theme: {{ currentTheme }}
    </button>
  </div>

  <div class="project-buttons">
    <button class="bg-btn compact-btn export-project-btn" type="button" (click)="openExportPopup()">
      Export
    </button>
    <button class="cta-btn save-project-btn" type="button" (click)="saveProject()">Save</button>
    <small class="saved-time">Saved: {{ lastSavedAt() ?? '--:--' }}</small>
  </div>

  <div class="history-buttons">
    <button class="bg-btn compact-btn history-btn" type="button" (click)="undo()">Undo</button>
    <button class="bg-btn compact-btn history-btn" type="button" (click)="redo()">Redo</button>
  </div>
</div>

@if (isExportPopupOpen) {
  <div class="export-popup-backdrop" (click)="closeExportPopup()">
    <div class="export-popup" (click)="$event.stopPropagation()">
      <h4>Export Options</h4>
      <label class="export-field">
        File name
        <input
          class="input-field"
          type="text"
          [(ngModel)]="exportFilename"
          placeholder="Optional custom filename"
        />
      </label>
      <label class="export-field">
        Scale
        <select class="input-field" [(ngModel)]="exportScale">
          <option [ngValue]="1">1x</option>
          <option [ngValue]="2">2x</option>
          <option [ngValue]="4">4x</option>
          <option [ngValue]="8">8x</option>
        </select>
      </label>
      <div class="export-range">
        <label class="export-field">
          From frame
          <input class="input-field" type="number" min="1" [(ngModel)]="exportFromFrame" />
        </label>
        <label class="export-field">
          To frame
          <input class="input-field" type="number" min="1" [(ngModel)]="exportToFrame" />
        </label>
      </div>
      <button class="bg-btn" type="button" (click)="exportProject('ACTIVE_FRAME')">
        Export Active Frame
      </button>
      <button class="bg-btn" type="button" (click)="exportProject('ALL_FRAMES')">
        Export All Frames (Sprite Sheet)
      </button>
      <button class="bg-btn" type="button" (click)="exportProject('GIF_ANIMATION')">
        Export GIF Animation
      </button>
      <button class="bg-btn" type="button" (click)="exportProject('APNG_ANIMATION')">
        Export APNG Animation
      </button>
      <button class="bg-btn" type="button" (click)="closeExportPopup()">Cancel</button>
    </div>
  </div>
}
