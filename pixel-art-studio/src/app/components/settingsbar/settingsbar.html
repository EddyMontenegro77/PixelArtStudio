<div class="settingsbar-container">
  <div class="project-buttons">
    <button class="export-project-btn" type="button" (click)="openExportPopup()">
      Export
    </button>
    <button class="save-project-btn" type="button" (click)="saveProject()">
      Save
    </button>
  </div>

  <div class="history-buttons">
    <button class="history-btn" type="button" (click)="undo()">
      Undo
    </button>
    <button class="history-btn" type="button" (click)="redo()">
      Redo
    </button>
  </div>
</div>

@if (isExportPopupOpen) {
  <div class="export-popup-backdrop" (click)="closeExportPopup()">
    <div class="export-popup" (click)="$event.stopPropagation()">
      <h4>Export Options</h4>
      <button type="button" (click)="exportProject('ACTIVE_FRAME')">Export Active Frame</button>
      <button type="button" (click)="exportProject('ALL_FRAMES')">
        Export All Frames (Sprite Sheet)
      </button>
      <button type="button" (click)="closeExportPopup()">Cancel</button>
    </div>
  </div>
}
