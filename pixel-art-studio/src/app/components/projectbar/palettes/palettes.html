<div class="palettes-container">
  <div class="palettes-header">
    <span class="palette-name-label">Palette</span>
    <small class="palette-count">{{ colors.length }} colors</small>
  </div>

  <div class="color-actions">
    <div class="selected-color-wrap">
      <input class="selected-color-input" type="color" [(ngModel)]="selectedColor" />
    </div>
    <button type="button" class="outline-btn add-color-btn" (click)="addSelectedColor()">
      Add color
    </button>
  </div>

  <div class="colors-grid">
    @for (color of colors; track $index) {
      <app-color-cell
        [color]="color"
        [index]="$index"
        [isSelected]="color === selectedColor"
        (select)="selectColor($event)"
        (remove)="removeColor($event)"
      >
      </app-color-cell>
    }
  </div>
</div>
