<div class="layer-container" [class.active]="isActive()" (click)="selectLayer()">
  <div class="layer-body">
    <div class="layer-reorder-controls">
      <button class="layer-order-btn icon-btn" (click)="handleMoveLayerUp($event)">
        <img class="layer-icon" [src]="getIconPath('arrow_up')" alt="Move up" title="Move layer up" />
      </button>
      <button class="layer-order-btn icon-btn" (click)="handleMoveLayerDown($event)">
        <img
          class="layer-icon"
          [src]="getIconPath('arrow_down')"
          alt="Move down"
          title="Move layer down"
        />
      </button>
    </div>

    <div class="layer-name-area">
      @if (!isEditingName) {
        <button
          class="layer-name-btn"
          type="button"
          (click)="beginRename($event)"
          [title]="layerName()"
        >
          {{ layerName() }}
        </button>
      } @else {
        <input
          type="text"
          class="layer-name-input input-field"
          [value]="nameDraft"
          (input)="nameDraft = $any($event.target).value"
          (keydown)="onRenameKeydown($event)"
          (blur)="commitRename($event)"
          maxlength="40"
          autofocus
        />
      }
    </div>

    <div class="layer-actions">
      <button class="visibility-button icon-btn" (click)="handleToggleVisibility($event)">
        @if (isLayerVisible()) {
          <img
            class="layer-icon"
            [src]="getIconPath('visible')"
            alt="visible icon"
            title="Toggle Visibility"
          />
        } @else {
          <img
            class="layer-icon"
            [src]="getIconPath('not_visible')"
            alt="not visible icon"
            title="Toggle Visibility"
          />
        }
      </button>

      <button class="layer-delete-btn icon-btn icon-btn-danger" (click)="removeLayer($event)">
        <img class="layer-icon" [src]="getIconPath('minus')" alt="Remove layer" title="Remove layer" />
      </button>
    </div>
  </div>
</div>
