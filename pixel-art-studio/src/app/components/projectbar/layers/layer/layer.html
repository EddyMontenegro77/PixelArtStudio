<div class="layer-container">
  <button class="visibility-button" (click)="toggleVisibility()">
    <img />
  </button>
  <label class="layer-name"></label>
  <div class="move-layer-buttons">
    <button class="move-up-layer" (click)="moveLayerUp()">
      <img />
    </button>
    <button class="move-down-layer" (click)="moveLayerDown()">
      <img />
    </button>
  </div>
</div>
