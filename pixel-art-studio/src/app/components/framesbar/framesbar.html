<div class="framesbar-container">
  <div class="frames-list">
    @for (frame of frames; track frame.getId()) {
      <div
        class="frame-item"
        [class.active]="frame.getId() === activeFrameId"
        (click)="selectFrame(frame.getId())"
      >
        <span>Frame {{ $index + 1 }}</span>
        <label class="duration-input-label">
          <input
            class="duration-input"
            type="number"
            min="20"
            max="10000"
            step="10"
            [value]="frame.getDuration()"
            (click)="$event.stopPropagation()"
            (change)="updateFrameDuration(frame.getId(), $event)"
          />
          ms
        </label>
        <button
          type="button"
          class="remove-frame-btn"
          (click)="removeFrame(frame.getId(), $event)"
          title="Remove frame"
        >
          x
        </button>
      </div>
    }
  </div>

  <button type="button" class="add-frame-btn" (click)="addFrame()">
    <img src="icons/plus_black.svg" alt="Add frame" />
    Add frame
  </button>
  <button
    type="button"
    class="toggle-play-animation-btn"
    (click)="togglePlaying()"
    [attr.aria-pressed]="isPlaying"
    [title]="isPlaying ? 'Stop preview' : 'Play preview'"
  >
    <img src="icons/play_pause_black.svg" alt="play-pause icon" />
  </button>

  <app-animation-preview (playbackChanged)="onPlaybackChanged($event)"></app-animation-preview>
</div>
