<div class="home-container">
  <h1>Pixel Art Studio</h1>
  <h2>Build bold. Pixel by pixel.</h2>
  <div class="call-to-action-containers">
    @if (isAuthenticated$ | async) {
      <button type="button" class="cta-btn new-project-btn" (click)="goToEditor()">
        CREATE A NEW PROJECT
      </button>
      <button type="button" class="cta-btn profile-btn" (click)="goToProfile()">MY PROJECTS</button>
    } @else {
      <button
        type="button"
        class="cta-btn new-project-btn guest-primary-btn"
        (click)="goToEditor()"
      >
        CREATE A NEW LOCAL PROJECT
      </button>
      <p>Don't lose your pixels! Log in to save them in the cloud.</p>
      <button type="button" class="cta-btn login-btn" (click)="goToLogIn()">LOG IN</button>
      <button type="button" class="cta-btn signup-btn" (click)="goToSignUp()">SIGN UP</button>
    }
  </div>
</div>
